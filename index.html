<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="header-brand">
      <span class="header-icon">💰</span>
      <div class="header-text">
        <span class="header-title">Budget Visualizer</span>
        <span class="header-sub">Track spending · Stay on budget</span>
      </div>
    </div>
    <button id="themeToggle" aria-label="Toggle dark/light mode">☀️</button>
  </div>
</header>

<div class="container">

  <!-- Balance Card — full width -->
  <div class="desktop-grid">
  <div class="card balance-card col-full">
    <div class="label">Total Balance</div>
    <div class="amount positive" id="balanceAmt">$0.00</div>
    <div class="stats">
      <div class="stat income">
        <div class="stat-label">↑ Income</div>
        <div class="stat-val" id="totalIncome">$0.00</div>
      </div>
      <div class="stat expense">
        <div class="stat-label">↓ Expenses</div>
        <div class="stat-val" id="totalExpense">$0.00</div>
      </div>
    </div>
    </div>
  </div><!-- /balance-card -->

  <!-- Left column: Spend Limit, Chart, Add Transaction -->
  <div class="desktop-col-left">

  <!-- Spend Limit -->
  <div class="card">
    <div class="card-title">Monthly Spend Limit</div>
    <div class="limit-row">
      <label for="spendLimitInput">Limit</label>
      <input id="spendLimitInput" type="number" placeholder="e.g. 500" min="0" step="1" />
    </div>
    <div class="limit-bar-wrap" id="limitBarWrap" style="display:none">
      <div class="limit-bar" id="limitBar"></div>
    </div>
    <div class="limit-info" id="limitInfo"></div>
  </div>

  <!-- Chart -->
  <div class="card">
    <div class="card-title">Spending by Category</div>
    <div id="chartArea">
      <div class="no-data">No expense data yet.</div>
    </div>
  </div>

  <!-- Add Transaction -->
  <div class="card">
    <div class="card-title">Add Transaction</div>
    <div class="form-grid">

      <div class="full">
        <label>Type</label>
        <div class="type-toggle">
          <div class="type-btn active-expense" id="btnExpense" role="button" tabindex="0">− Expense</div>
          <div class="type-btn" id="btnIncome" role="button" tabindex="0">+ Income</div>
        </div>
      </div>

      <div class="full">
        <label for="txName">Description</label>
        <input id="txName" type="text" placeholder="e.g. Coffee, Salary…" maxlength="40" />
      </div>

      <div class="amount-col">
        <label for="txAmount">Amount</label>
        <div class="amount-row">
          <div class="currency-toggle">
            <button class="cur-btn active" id="curUSD">USD</button>
            <button class="cur-btn" id="curIDR">IDR</button>
          </div>
          <input id="txAmount" type="number" placeholder="0.00" min="0.01" step="0.01" />
        </div>
      </div>

      <div class="cat-col">
        <label for="txCat">Category</label>
        <select id="txCat"></select>
      </div>

      <div class="full">
        <label for="txDate">Date</label>
        <input id="txDate" type="date" />
      </div>

      <div class="full">
        <label for="newCatName">Add Custom Category</label>
        <div class="custom-cat-row">
          <input id="newCatName" type="text" placeholder="e.g. Gym, Pets…" maxlength="24" />
          <button id="addCatBtn">+ Add</button>
        </div>
      </div>

    </div>
    <button class="add-btn" id="addTxBtn">Add Transaction</button>
  </div>

  <!-- History / Summary -->
  <div class="card">
    <div class="tab-nav">
      <button class="tab-btn active" id="tabHistory">Transaction History</button>
      <button class="tab-btn" id="tabSummary">Monthly Summary</button>
    </div>

    <!-- History panel -->
    <div id="panelHistory">
      <div class="controls-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="expense">Expenses</button>
        <button class="filter-btn" data-filter="income">Income</button>
        <select class="sort-select" id="sortSelect" aria-label="Sort transactions">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Highest amount</option>
          <option value="amount-asc">Lowest amount</option>
          <option value="category">By category</option>
        </select>
      </div>
      <div class="tx-list" id="txList"></div>
    </div>

    <!-- Summary panel -->
    <div id="panelSummary" style="display:none">
      <div class="month-nav">
        <button id="prevMonthBtn" aria-label="Previous month">&#8249;</button>
        <span id="summaryMonthLabel"></span>
        <button id="nextMonthBtn" aria-label="Next month">&#8250;</button>
      </div>
      <div class="month-stats">
        <div class="month-stat ms-income">
          <div class="ms-label">↑ Income</div>
          <div class="ms-val" id="msIncome">$0.00</div>
        </div>
        <div class="month-stat ms-expense">
          <div class="ms-label">↓ Expenses</div>
          <div class="ms-val" id="msExpense">$0.00</div>
        </div>
        <div class="month-stat ms-balance">
          <div class="ms-label">Balance</div>
          <div class="ms-val" id="msBalance">$0.00</div>
        </div>
      </div>
      <div class="month-cat-list" id="monthlyCatList"></div>
    </div>

  </div>

</div><!-- /container -->

<script src="js/app.js"></script>
</body>
</html>
